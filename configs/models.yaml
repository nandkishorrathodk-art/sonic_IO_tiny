# ============================================
# SONIC-REDA — Model Routing Configuration
# ============================================
# Maps task types to preferred LLM providers/models.
# The Model Router uses this to pick the best model for each job.
# ============================================

# Default provider and model when no task-specific rule matches
default_provider: nvidia
default_model: moonshotai/kimi-k3

# ---- Provider Definitions ----
providers:
  openrouter:
    name: OpenRouter (All Flagship Models)
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    models:
      - id: deepseek/deepseek-r1
        speed_tier: medium
        cost_per_1k_input: 0.0008
        cost_per_1k_output: 0.0024
        capabilities: [reasoning, coding, planning, tool_use]
      - id: anthropic/claude-3.5-sonnet
        speed_tier: medium
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        capabilities: [reasoning, coding, planning, tool_use]
      - id: meta-llama/llama-3.3-70b-instruct
        speed_tier: fast
        cost_per_1k_input: 0.0004
        cost_per_1k_output: 0.0008
        capabilities: [reasoning, coding, planning]
      - id: openai/gpt-4o
        speed_tier: medium
        cost_per_1k_input: 0.0025
        cost_per_1k_output: 0.01
        capabilities: [reasoning, coding, verification]

  deepseek:
    name: DeepSeek Native (V3 & R1 671B)
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    base_url: https://api.deepseek.com
    models:
      - id: deepseek-chat
        speed_tier: fast
        cost_per_1k_input: 0.00027
        cost_per_1k_output: 0.0011
        capabilities: [reasoning, coding, planning, tool_use]
      - id: deepseek-reasoner
        speed_tier: medium
        cost_per_1k_input: 0.00055
        cost_per_1k_output: 0.00219
        capabilities: [reasoning, coding, static_analysis]

  groq:
    name: Groq Ultra-Fast Inference
    api_key_env: GROQ_API_KEY
    base_url_env: GROQ_BASE_URL
    base_url: https://api.groq.com/openai/v1
    models:
      - id: llama-3.3-70b-versatile
        speed_tier: fast
        cost_per_1k_input: 0.00059
        cost_per_1k_output: 0.00079
        capabilities: [reasoning, coding, planning, tool_use]
      - id: deepseek-r1-distill-llama-70b
        speed_tier: fast
        cost_per_1k_input: 0.00059
        cost_per_1k_output: 0.00079
        capabilities: [reasoning, coding]

  nvidia:
    name: NVIDIA NIM API
    api_key_env: NVIDIA_API_KEY
    base_url_env: NVIDIA_BASE_URL
    base_url: https://integrate.api.nvidia.com/v1
    models:
      - id: moonshotai/kimi-k3
        speed_tier: fast
        cost_per_1k_input: 0.0005
        cost_per_1k_output: 0.001
        capabilities: [reasoning, coding, planning, vision, tool_use, multimodal]
      - id: nvidia/nemotron-3.5-lightning-30b-a3b
        speed_tier: fast
        cost_per_1k_input: 0.0005
        cost_per_1k_output: 0.001
        capabilities: [reasoning, coding, planning, tool_use, general]
      - id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
        speed_tier: medium
        cost_per_1k_input: 0.0005
        cost_per_1k_output: 0.001
        capabilities: [reasoning, coding, architecture]
      - id: meta/llama-3.2-11b-vision-instruct
        speed_tier: fast
        cost_per_1k_input: 0.0003
        cost_per_1k_output: 0.0006
        capabilities: [vision, fast_tasks]
      - id: openai/gpt-oss-20b
        speed_tier: fast
        cost_per_1k_input: 0.0005
        cost_per_1k_output: 0.0015
        capabilities: [reasoning, coding, planning, tool_use, thinking]

  claude:
    name: Anthropic Claude
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    models:
      - id: claude-3-5-sonnet-20241022
        speed_tier: medium
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        capabilities: [reasoning, coding, planning, tool_use]
      - id: claude-3-7-sonnet-20250219
        speed_tier: medium
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        capabilities: [reasoning, coding, planning, tool_use]
      - id: claude-haiku-3
        speed_tier: fast
        cost_per_1k_input: 0.00025
        cost_per_1k_output: 0.00125
        capabilities: [fast_tasks, classification]

  openai:
    name: OpenAI
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    models:
      - id: gpt-4o
        speed_tier: medium
        cost_per_1k_input: 0.0025
        cost_per_1k_output: 0.01
        capabilities: [reasoning, coding, verification]
      - id: gpt-4o-mini
        speed_tier: fast
        cost_per_1k_input: 0.00015
        cost_per_1k_output: 0.0006
        capabilities: [fast_tasks, classification]

  grok:
    name: xAI Grok
    api_key_env: XAI_API_KEY
    base_url: https://api.x.ai/v1
    models:
      - id: grok-3
        speed_tier: fast
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        capabilities: [reasoning, fast_recon, tool_use]

  local:
    name: Local (Ollama / vLLM)
    base_url_env: LOCAL_LLM_URL
    models:
      - id: llama3.1:70b
        speed_tier: slow
        cost_per_1k_input: 0.0
        cost_per_1k_output: 0.0
        capabilities: [reasoning, coding, offline]

# ---- Task Routing Rules ----
# Maps agent task types to preferred provider + model
routing_rules:
  planning:
    description: 'High-level planning, task decomposition, strategy'
    provider: nvidia
    model: moonshotai/kimi-k3
    fallback: [nvidia/openai/gpt-oss-20b, nvidia/nemotron-3.5-lightning-30b-a3b, openrouter/deepseek/deepseek-r1, claude/claude-3-5-sonnet-20241022]

  reasoning:
    description: 'Code analysis, dataflow tracing, pattern matching'
    provider: nvidia
    model: moonshotai/kimi-k3
    fallback: [nvidia/openai/gpt-oss-20b, nvidia/nemotron-3.5-lightning-30b-a3b, openrouter/deepseek/deepseek-r1, claude/claude-3-5-sonnet-20241022]

  fast_recon:
    description: 'Quick reconnaissance, asset discovery, tech detection'
    provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
    fallback: [groq/llama-3.3-70b-versatile, openai/gpt-4o-mini, grok/grok-3]

  coding:
    description: 'Code generation, fix generation, test writing'
    provider: nvidia
    model: moonshotai/kimi-k3
    fallback: [nvidia/openai/gpt-oss-20b, nvidia/nemotron-3.5-lightning-30b-a3b, deepseek/deepseek-reasoner, claude/claude-3-5-sonnet-20241022]

  verification:
    description: 'Evidence checking, confidence scoring, FP filtering'
    provider: nvidia
    model: moonshotai/kimi-k3
    fallback: [nvidia/openai/gpt-oss-20b, nvidia/nemotron-3.5-lightning-30b-a3b, openai/gpt-4o, claude/claude-3-5-sonnet-20241022]

  hypothesis:
    description: 'Novel bug class ideation, creative reasoning'
    provider: nvidia
    model: moonshotai/kimi-k3
    fallback: [nvidia/openai/gpt-oss-20b, nvidia/nemotron-3-nano-omni-30b-a3b-reasoning, openrouter/deepseek/deepseek-r1]

  classification:
    description: 'Quick labeling, triage, categorization'
    provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
    fallback: [groq/llama-3.3-70b-versatile, openai/gpt-4o-mini]

  vision:
    description: 'Multimodal vision, desktop screenshot parsing, visual UI grounding'
    provider: nvidia
    model: moonshotai/kimi-k3
    fallback: [meta/llama-3.2-11b-vision-instruct, openrouter/openai/gpt-4o, claude/claude-3-5-sonnet-20241022]

  computer_use:
    description: 'Autonomous computer vision and desktop interaction'
    provider: nvidia
    model: moonshotai/kimi-k3
    fallback: [nvidia/openai/gpt-oss-20b, meta/llama-3.2-11b-vision-instruct, openrouter/openai/gpt-4o, claude/claude-3-5-sonnet-20241022]

# ---- Global Fallback Chain ----
# If the preferred provider for a task fails, try these in order
global_fallback_chain:
  - openrouter
  - deepseek
  - groq
  - claude
  - openai
  - nvidia
  - local

# ---- Cost Controls ----
cost_limits:
  max_per_request_usd: 1.00
  max_per_engagement_usd: 50.00
  warn_at_percent: 80

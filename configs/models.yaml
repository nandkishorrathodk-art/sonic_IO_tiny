# ============================================
# SONIC-REDA — Model Routing Configuration
# ============================================
# Maps task types to preferred LLM providers/models.
# The Model Router uses this to pick the best model for each job.
# ============================================

# Default provider when no task-specific rule matches
default_provider: claude
default_model: claude-sonnet-4-20250514

# ---- Provider Definitions ----
providers:
  claude:
    name: Anthropic Claude
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    models:
      - id: claude-sonnet-4-20250514
        speed_tier: medium
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        capabilities: [reasoning, coding, planning, tool_use]
      - id: claude-haiku-3
        speed_tier: fast
        cost_per_1k_input: 0.00025
        cost_per_1k_output: 0.00125
        capabilities: [fast_tasks, classification]

  openai:
    name: OpenAI
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    models:
      - id: gpt-4o
        speed_tier: medium
        cost_per_1k_input: 0.005
        cost_per_1k_output: 0.015
        capabilities: [reasoning, coding, verification]
      - id: gpt-4o-mini
        speed_tier: fast
        cost_per_1k_input: 0.00015
        cost_per_1k_output: 0.0006
        capabilities: [fast_tasks, classification]

  grok:
    name: xAI Grok
    api_key_env: XAI_API_KEY
    base_url: https://api.x.ai/v1
    models:
      - id: grok-3
        speed_tier: fast
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        capabilities: [reasoning, fast_recon, tool_use]

  deepseek:
    name: DeepSeek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    models:
      - id: deepseek-coder
        speed_tier: medium
        cost_per_1k_input: 0.0014
        cost_per_1k_output: 0.0028
        capabilities: [coding, static_analysis, reasoning]
      - id: deepseek-chat
        speed_tier: fast
        cost_per_1k_input: 0.0007
        cost_per_1k_output: 0.0014
        capabilities: [fast_tasks, reasoning]

  local:
    name: Local (Ollama / vLLM)
    base_url_env: LOCAL_LLM_URL
    models:
      - id: llama3.1:70b
        speed_tier: slow
        cost_per_1k_input: 0.0
        cost_per_1k_output: 0.0
        capabilities: [reasoning, coding, offline]

# ---- Task Routing Rules ----
# Maps agent task types to preferred provider + model
routing_rules:
  planning:
    description: "High-level planning, task decomposition, strategy"
    provider: claude
    model: claude-sonnet-4-20250514
    fallback: [openai/gpt-4o, grok/grok-3]

  reasoning:
    description: "Code analysis, dataflow tracing, pattern matching"
    provider: deepseek
    model: deepseek-coder
    fallback: [claude/claude-sonnet-4-20250514]

  fast_recon:
    description: "Quick reconnaissance, asset discovery, tech detection"
    provider: grok
    model: grok-3
    fallback: [openai/gpt-4o-mini, claude/claude-haiku-3]

  coding:
    description: "Code generation, fix generation, test writing"
    provider: claude
    model: claude-sonnet-4-20250514
    fallback: [deepseek/deepseek-coder]

  verification:
    description: "Evidence checking, confidence scoring, FP filtering"
    provider: openai
    model: gpt-4o
    fallback: [claude/claude-sonnet-4-20250514]

  hypothesis:
    description: "Novel bug class ideation, creative reasoning"
    provider: claude
    model: claude-sonnet-4-20250514
    fallback: [grok/grok-3]

  classification:
    description: "Quick labeling, triage, categorization"
    provider: openai
    model: gpt-4o-mini
    fallback: [claude/claude-haiku-3]

# ---- Global Fallback Chain ----
# If the preferred provider for a task fails, try these in order
global_fallback_chain:
  - claude
  - openai
  - deepseek
  - grok
  - local

# ---- Cost Controls ----
cost_limits:
  max_per_request_usd: 1.00
  max_per_engagement_usd: 50.00
  warn_at_percent: 80

version: '3.8'

# =================================================================
# SONIC-REDA — Production / Cloud Staging Deployment Topology
# =================================================================

networks:
  sonic-internal:
    driver: bridge
    internal: true # No direct internet access for backend databases
  sonic-dmz:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  caddy-data:
  caddy-config:

services:
  # -------------------------------------------------------------
  # 1. Edge Ingress & TLS Termination (Caddy)
  # -------------------------------------------------------------
  edge-proxy:
    image: caddy:2-alpine
    container_name: sonic-edge-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - sonic-dmz
    depends_on:
      - sonic-api
      - sonic-dashboard

  # -------------------------------------------------------------
  # 2. Control Plane API (FastAPI)
  # -------------------------------------------------------------
  sonic-api:
    build:
      context: ../sonic-core
      dockerfile: Dockerfile
    container_name: sonic-control-plane
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://sonic_admin:${POSTGRES_PASSWORD}@postgres:5432/sonic_db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DAYTONA_API_KEY=${DAYTONA_API_KEY}
      - DAYTONA_API_URL=${DAYTONA_API_URL}
    networks:
      - sonic-dmz
      - sonic-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # 3. Async Agent Execution Worker
  # -------------------------------------------------------------
  sonic-worker:
    build:
      context: ../sonic-core
      dockerfile: Dockerfile.worker
    container_name: sonic-worker-node-1
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://sonic_admin:${POSTGRES_PASSWORD}@postgres:5432/sonic_db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DAYTONA_API_KEY=${DAYTONA_API_KEY}
      - DAYTONA_API_URL=${DAYTONA_API_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # For launching isolated container sandboxes
    networks:
      - sonic-internal
    depends_on:
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # 4. Web Dashboard (Next.js)
  # -------------------------------------------------------------
  sonic-dashboard:
    build:
      context: ../sonic-dashboard
      dockerfile: Dockerfile
    container_name: sonic-mission-control-ui
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.sonic-reda.corp
    networks:
      - sonic-dmz

  # -------------------------------------------------------------
  # 5. PostgreSQL 16 (Relational Identity & Findings)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sonic-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sonic_db
      - POSTGRES_USER=sonic_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sonic-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonic_admin -d sonic_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 6. Redis 7 (Distributed Job Queue & Mutex)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sonic-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks:
      - sonic-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 7. Neo4j 5 (Graph Memory & Lineage)
  # -------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: sonic-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
    networks:
      - sonic-internal
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

[project]
name = "sonic-reda"
version = "0.1.0"
description = "SONIC-REDA — Next-Generation Autonomous AI Bug Hunting System"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}

[tool.uv.workspace]
members = ["sonic-core", "sonic-cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["sonic-core/tests", "sonic-cli/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",
    "E402",
    "E741",
    "E701",
    "W293",
    "N801",
    "N805",
    "N806",
    "N818",
    "UP022",
]

[tool.mypy]
python_version = "3.12"
strict = true

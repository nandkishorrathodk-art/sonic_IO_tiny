[project]
name = "sonic-cli"
version = "0.1.0"
description = "SONIC-REDA CLI — Command-line interface for the bug hunting system"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    "typer>=0.12.0",
    "rich>=13.8.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
sonic = "sonic_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project]
name = "sonic-cli"
version = "0.1.0"
description = "SONIC-REDA CLI — Command-line interface for the bug hunting system"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "httpx>=0.28.1",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
sonic = "sonic_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["sonic_cli", "sonic"]

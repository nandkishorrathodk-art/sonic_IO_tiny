[project]
name = "sonic-core"
version = "0.1.0"
description = "SONIC-REDA Core Backend — Agents, LLM Router, Graph Memory, Evidence Engine"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    
    # Auth
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # LLM SDKs
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    
    # Data & Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.1",
    
    # Database
    "neo4j>=5.25.0",
    "redis[hiredis]>=5.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    
    # Utilities
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",

    # Remote graphical workstation provider
    "daytona",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",  # for TestClient
]

[tool.setuptools.packages.find]
include = ["sonic*"]
exclude = ["sonic_data*"]
